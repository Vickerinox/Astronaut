[package]
name = "font_converter"
version = "0.1.0"
edition = "2024"

[dependencies]
egui_extras = {version = "0.36.2", default-features = false, features = [
    "image"
]}
egui_dock = {version = "0.21.1", default-features = false}
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
image = { version = "0.25", features = ["png"] }
rfd = { version = "0.17.2" }
build_tools = { path = "../building/" }
