cargo-features = ["trim-paths"]
[package]
name = "astronaut-builder"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "astronaut/arm7",
    "astronaut/arm9",
    "crates/common",
    "crates/micro_imgui",
    "crates/reboot_lib"
, "crates/micro_imgui_ds", "tools/font_converter", "tools/building"]

[dependencies]
common = {path="./crates/common"}
elf = "0.7.4"
fatfs-embedded = {git="https://github.com/Vickerinox/fatfs-embedded.git", rev="155488e5753d8ed2ba43d268bdaa656871d25940"}

sha1 = "0.10.6"
rust-crypto = "0.2.36"
clap = { version = "4.5.23", features = ["derive"] }
thiserror = "2.0.9"
tracing = { version = "0.1.41", features = ["log-always"] }
tracing-subscriber = { version = "0.3.19", features = ["time"] }
similar = "2.6.0"
hexify = "0.0.3"
console = "0.15.10"
log = "0.4"
