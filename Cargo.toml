cargo-features = ["trim-paths"]
[package]
name = "astronaut-builder"
version = "0.2.0"
edition = "2021"

[workspace]
members = [
    "astronaut/arm7",
    "astronaut/arm9",
    "crates/common",
    "crates/micro_imgui",
    "crates/reboot_lib"
, "crates/micro_imgui_ds", "tools/font_converter", "tools/building"]

[dependencies]
common = {path="./crates/common"}
elf = "0.7.4"
fatfs-embedded = {git="https://github.com/Vickerinox/fatfs-embedded.git", rev="1e548b37a764cccebaaf1b20af7e4a5ee71f208a"}

sha1 = "0.10.6"
rust-crypto = "0.2.36"
clap = { version = "4.5.23", features = ["derive"] }
thiserror = "2.0.9"
env_logger = "0.11.11"
log = "0.4"
